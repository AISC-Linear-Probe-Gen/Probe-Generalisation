defaults:
  - _self_

seed: 0

model:
  name_or_path: meta-llama/Llama-3.2-3B-Instruct
  device_map: auto
  torch_dtype: bfloat16

dataset:
  name: Mechanistic-Anomaly-Detection/llama3-jailbreaks
  positive_split: circuit_breakers_train
  negative_split: benign_instructions_train
  prompt_col: prompt
  completion_col: completion
  add_chat_template: true
  preprocess:
    prompt_col:
      - preprocessing.extract_llama_instruction
      - preprocessing.strip
    completion_col: null

probe:
  kind: linear # linear | mlp
  target: input # input | generation
  layers: null # null means all layers
  mlp_hidden: 64

training:
  epochs: 200
  batch_size: 16
  lr: 0.001
  weight_decay: 0.01
  probe_device: auto
  layer_chunk_size: 28
  log_every: 20

output:
  dir: outputs/probes/harmfulness

hydra:
  run:
    dir: .
  output_subdir: null
